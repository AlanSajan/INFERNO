<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<title>Universal AI Chat</title>

<!-- Tailwind CSS (CDN only, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  try {
    tailwind.config = { darkMode: 'class' };
  } catch (e) {}
</script>

<!-- Marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<style>
  /* ============================================================
     CRITICAL LAYOUT CSS (custom class names to avoid clashing
     with Tailwind utility classes injected at runtime)
     ============================================================ */
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    overscroll-behavior-y: none;
  }

  /* --- Loading fallback --- */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #5f6368;
    background: #ffffff;
    z-index: 999;
    font-family: inherit;
  }

  /* --- App shell: fills the viewport, works with mobile keyboards --- */
  .app-shell {
    display: flex;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* --- Sidebar --- */
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: 280px;
    flex: 0 0 280px;
    z-index: 40;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    will-change: transform;
  }
  .sidebar.open { transform: translateX(0); }

  @media (min-width: 768px) {
    .sidebar {
      position: relative;
      transform: none;
      z-index: 1;
      transition: none;
    }
  }

  /* --- Backdrop for mobile sidebar --- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 35;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  @media (min-width: 768px) {
    .backdrop { display: none !important; }
  }

  /* --- Main column --- */
  .main-col {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  /* --- Scrollable message area --- */
  .messages {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* --- Composer always visible --- */
  .composer-wrap {
    flex: 0 0 auto;
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    background: inherit;
  }

  /* --- Sidebar action buttons --- */
  .sidebar-action {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    text-align: left;
    background: transparent;
    border: 0;
    cursor: pointer;
    color: inherit;
    transition: background 0.15s ease;
  }
  .sidebar-action:hover { background: rgba(0, 0, 0, 0.05); }
  .dark .sidebar-action:hover { background: rgba(255, 255, 255, 0.08); }

  /* --- Chat list rows --- */
  .chat-row {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.5rem 0.75rem;
    border-radius: 9999px;
    cursor: pointer;
    font-size: 0.875rem;
    transition: background 0.15s ease;
    user-select: none;
  }
  .chat-row:hover { background: rgba(0, 0, 0, 0.05); }
  .chat-row.active { background: rgba(0, 0, 0, 0.08); }
  .dark .chat-row:hover { background: rgba(255, 255, 255, 0.07); }
  .dark .chat-row.active { background: rgba(255, 255, 255, 0.12); }

  .chat-act {
    opacity: 0;
    font-size: 11px;
    line-height: 1;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  .chat-row:hover .chat-act { opacity: 0.75; }
  .chat-act:hover { opacity: 1 !important; background: rgba(0, 0, 0, 0.09); }
  .dark .chat-act:hover { background: rgba(255, 255, 255, 0.14); }
  @media (hover: none) {
    .chat-act { opacity: 0.55; }
  }

  /* --- Markdown body --- */
  .md { font-size: 15px; line-height: 1.7; word-wrap: break-word; overflow-wrap: anywhere; }
  .md > *:first-child { margin-top: 0 !important; }
  .md > *:last-child { margin-bottom: 0 !important; }
  .md p { margin: 0 0 0.75em; }
  .md h1, .md h2, .md h3, .md h4 { font-weight: 600; margin: 1em 0 0.45em; line-height: 1.3; }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.05em; }
  .md ul, .md ol { margin: 0.5em 0 0.85em 1.35em; }
  .md ul { list-style: disc; }
  .md ol { list-style: decimal; }
  .md li { margin: 0.2em 0; }
  .md a { color: #1a73e8; text-decoration: underline; }
  .dark .md a { color: #8ab4f8; }
  .md blockquote {
    border-left: 3px solid #d1d5db;
    padding-left: 12px;
    margin: 0.7em 0;
    color: #6b7280;
  }
  .dark .md blockquote { border-color: #4b5563; color: #9aa0a6; }
  .md hr { border: 0; border-top: 1px solid rgba(0, 0, 0, 0.1); margin: 1em 0; }
  .dark .md hr { border-color: rgba(255, 255, 255, 0.12); }

  .md pre {
    position: relative;
    background: #f1f3f4;
    color: #1f1f1f;
    padding: 14px 14px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 0.7em 0;
    font-size: 13px;
    line-height: 1.55;
    border: 1px solid rgba(0, 0, 0, 0.06);
  }
  .dark .md pre {
    background: #0d0d0e;
    color: #e8eaed;
    border-color: rgba(255, 255, 255, 0.08);
  }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.875em;
  }
  .md pre code { font-size: 13px; }
  .md :not(pre) > code {
    background: rgba(0, 0, 0, 0.07);
    padding: 2px 5px;
    border-radius: 5px;
  }
  .dark .md :not(pre) > code { background: rgba(255, 255, 255, 0.13); }

  .md table { border-collapse: collapse; margin: 0.7em 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid rgba(0, 0, 0, 0.15); padding: 6px 10px; font-size: 0.9em; }
  .dark .md th, .dark .md td { border-color: rgba(255, 255, 255, 0.16); }

  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 7px;
    background: rgba(0, 0, 0, 0.08);
    border: 0;
    cursor: pointer;
    color: inherit;
    opacity: 0.85;
    transition: opacity 0.15s ease;
  }
  .copy-btn:hover { opacity: 1; }
  .dark .copy-btn { background: rgba(255, 255, 255, 0.13); }

  /* --- Typing dots --- */
  .dots { display: inline-flex; gap: 4px; align-items: center; height: 1.3em; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.3;
    animation: dotBlink 1.2s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: 0.18s; }
  .dots i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dotBlink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 0.9; transform: translateY(-2px); }
  }

  /* --- Error box --- */
  .err-box {
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.25);
    color: #b91c1c;
    word-break: break-word;
  }
  .dark .err-box { color: #fca5a5; background: rgba(220, 38, 38, 0.14); }

  /* --- Suggestion chips --- */
  .sugg-btn {
    text-align: left;
    padding: 0.75rem 1rem;
    border-radius: 14px;
    font-size: 0.85rem;
    border: 1px solid rgba(0, 0, 0, 0.09);
    background: transparent;
    cursor: pointer;
    color: inherit;
    transition: background 0.15s ease;
  }
  .sugg-btn:hover { background: rgba(0, 0, 0, 0.04); }
  .dark .sugg-btn { border-color: rgba(255, 255, 255, 0.12); }
  .dark .sugg-btn:hover { background: rgba(255, 255, 255, 0.07); }

  /* --- Modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-card {
    width: 100%;
    max-width: 540px;
    max-height: 88dvh;
    overflow-y: auto;
    border-radius: 20px;
    -webkit-overflow-scrolling: touch;
  }

  /* --- Form fields --- */
  .field-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
    color: #5f6368;
  }
  .dark .field-label { color: #9aa0a6; }

  .field-input {
    width: 100%;
    padding: 0.65rem 0.85rem;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    background: #ffffff;
    color: inherit;
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    box-sizing: border-box;
  }
  .field-input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); }
  .dark .field-input {
    border-color: rgba(255, 255, 255, 0.16);
    background: #131314;
  }

  .btn-primary {
    padding: 0.6rem 1.3rem;
    border-radius: 9999px;
    background: #1a73e8;
    color: #fff;
    font-size: 0.875rem;
    font-weight: 500;
    border: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: #1765cc; }

  .btn-ghost {
    padding: 0.6rem 1.2rem;
    border-radius: 9999px;
    background: transparent;
    color: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    border: 0;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-ghost:hover { background: rgba(0, 0, 0, 0.06); }
  .dark .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

  /* --- Toast --- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 90;
    max-width: 90vw;
    padding: 0.7rem 1.1rem;
    border-radius: 9999px;
    font-size: 0.83rem;
    background: #202124;
    color: #fff;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    text-align: center;
  }
  .dark .toast { background: #e8eaed; color: #202124; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* --- Scrollbars (desktop) --- */
  @media (min-width: 768px) {
    .messages::-webkit-scrollbar, #chatList::-webkit-scrollbar, .modal-card::-webkit-scrollbar {
      width: 8px;
    }
    .messages::-webkit-scrollbar-thumb, #chatList::-webkit-scrollbar-thumb, .modal-card::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.16);
      border-radius: 8px;
    }
    .dark .messages::-webkit-scrollbar-thumb,
    .dark #chatList::-webkit-scrollbar-thumb,
    .dark .modal-card::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
    }
  }

  textarea { font-family: inherit; }
  button { touch-action: manipulation; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-white text-gray-900 dark:bg-[#131314] dark:text-[#e8eaed]">

  <!-- ================= LOADING FALLBACK ================= -->
  <div id="loading">Loading App…</div>

  <!-- ================= APP ================= -->
  <div id="app" class="app-shell" style="display:none;">

    <!-- ---------- SIDEBAR ---------- -->
    <aside id="sidebar"
      class="sidebar bg-[#f0f4f9] dark:bg-[#1e1f20] border-r border-black/5 dark:border-white/10">

      <div class="p-3 flex items-center gap-2 shrink-0">
        <button id="newChatBtn" type="button"
          class="flex-1 flex items-center gap-3 px-4 py-2.5 rounded-full bg-white dark:bg-[#282a2c] hover:bg-gray-100 dark:hover:bg-[#333537] text-sm font-medium shadow-sm transition">
          <span class="text-lg leading-none">+</span>
          <span>New chat</span>
        </button>
        <button id="closeSidebarBtn" type="button" aria-label="Close sidebar"
          class="md:hidden w-9 h-9 rounded-full grid place-items-center hover:bg-black/5 dark:hover:bg-white/10 shrink-0">✕</button>
      </div>

      <div id="chatList" class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5"></div>

      <div class="p-3 border-t border-black/5 dark:border-white/10 space-y-1 shrink-0">
        <button id="settingsBtn" type="button" class="sidebar-action">
          <span>⚙️</span><span>Settings</span>
        </button>
        <button id="themeBtn" type="button" class="sidebar-action">
          <span id="themeIcon">🌙</span><span id="themeLabel">Dark mode</span>
        </button>
      </div>
    </aside>

    <div id="backdrop" class="backdrop"></div>

    <!-- ---------- MAIN ---------- -->
    <main class="main-col bg-white dark:bg-[#131314]">

      <!-- Header -->
      <header
        class="flex items-center gap-1.5 px-2 md:px-4 h-14 shrink-0 border-b border-black/5 dark:border-white/10 bg-white/90 dark:bg-[#131314]/90 backdrop-blur">
        <button id="menuBtn" type="button" aria-label="Open sidebar"
          class="md:hidden w-10 h-10 rounded-full grid place-items-center hover:bg-black/5 dark:hover:bg-white/10 shrink-0">☰</button>
        <div id="chatTitle" class="font-medium truncate flex-1 text-[15px] min-w-0">New chat</div>
        <span id="modelBadge"
          class="hidden sm:inline-block text-[11px] px-2.5 py-1 rounded-full bg-black/5 dark:bg-white/10 text-gray-500 dark:text-gray-400 truncate max-w-[200px]"></span>
      </header>

      <!-- Messages -->
      <div id="messages" class="messages px-3 md:px-6 py-5">
        <div id="messagesInner" class="max-w-3xl mx-auto"></div>
      </div>

      <!-- Composer -->
      <div class="composer-wrap px-3 md:px-6 pt-2 bg-white dark:bg-[#131314]">
        <div class="max-w-3xl mx-auto">
          <div
            class="flex items-end gap-1.5 rounded-[26px] border border-black/10 dark:border-white/15 bg-white dark:bg-[#1e1f20] px-3 py-2 shadow-sm focus-within:border-black/20 dark:focus-within:border-white/25 transition">

            <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off" spellcheck="true"
              class="flex-1 resize-none bg-transparent outline-none border-0 text-[15px] leading-6 py-2 px-1 max-h-[180px] overflow-y-auto placeholder-gray-400 dark:placeholder-gray-500"></textarea>

            <button id="sendBtn" type="button" aria-label="Send message"
              class="w-9 h-9 mb-0.5 rounded-full grid place-items-center shrink-0 bg-[#1a73e8] text-white hover:bg-[#1765cc] transition disabled:opacity-40">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>

            <button id="stopBtn" type="button" aria-label="Stop generating"
              style="display:none;"
              class="w-9 h-9 mb-0.5 rounded-full grid place-items-center shrink-0 bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-900 hover:opacity-90 transition">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"></rect>
              </svg>
            </button>
          </div>

          <p class="text-[11px] text-center mt-2 text-gray-400 dark:text-gray-500 select-none">
            AI can make mistakes. Please verify important information.
          </p>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= SETTINGS MODAL ================= -->
  <div id="settingsModal" class="modal-overlay" style="display:none;">
    <div class="modal-card bg-white dark:bg-[#1e1f20] p-5 shadow-2xl border border-black/5 dark:border-white/10">

      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-semibold">Settings</h2>
        <button id="closeSettingsBtn" type="button" aria-label="Close settings"
          class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5 dark:hover:bg-white/10">✕</button>
      </div>

      <label class="field-label" for="apiKeyInput">OpenRouter API Key</label>
      <div class="relative mb-4">
        <input id="apiKeyInput" type="password" class="field-input pr-16" placeholder="sk-or-v1-..." autocomplete="off"
          spellcheck="false" />
        <button id="toggleKeyBtn" type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] px-2 py-1 rounded-md hover:bg-black/5 dark:hover:bg-white/10">Show</button>
      </div>

      <label class="field-label" for="modelInput">Model</label>
      <input id="modelInput" type="text" class="field-input" placeholder="deepseek/deepseek-r1:free"
        autocomplete="off" spellcheck="false" />
      <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1.5 mb-4">
        Get a free key at <span class="underline">openrouter.ai/keys</span>
      </p>

      <label class="field-label" for="sysPromptInput">Global system prompt</label>
      <textarea id="sysPromptInput" rows="3" class="field-input mb-4"
        placeholder="You are a helpful, concise assistant."></textarea>

      <label class="field-label" for="chatSysPromptInput">
        System prompt for this chat <span class="normal-case font-normal text-gray-400">(optional override)</span>
      </label>
      <textarea id="chatSysPromptInput" rows="3" class="field-input mb-5"
        placeholder="Leave empty to use the global system prompt"></textarea>

      <div class="flex gap-2 justify-end">
        <button id="cancelSettingsBtn" type="button" class="btn-ghost">Cancel</button>
        <button id="saveSettingsBtn" type="button" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ============================================================
       APP SCRIPT — placed at the VERY END of <body>
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    /* =========================================================
       0. SAFETY NET — never leave the user on a blank page
       ========================================================= */
    window.addEventListener('error', function () {
      var l = document.getElementById('loading');
      if (l && l.style.display !== 'none') {
        l.textContent = 'App failed to start. Please reload the page.';
      }
    });

    /* =========================================================
       1. HELPERS
       ========================================================= */
    function $(id) { return document.getElementById(id); }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var LS = {
      get: function (k, d) {
        try {
          var v = localStorage.getItem(k);
          return v === null ? d : JSON.parse(v);
        } catch (e) { return d; }
      },
      set: function (k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* quota / private mode */ }
      }
    };

    /* =========================================================
       2. STATE
       ========================================================= */
    var STORE = {
      chats: 'uai_chats_v1',
      active: 'uai_active_v1',
      settings: 'uai_settings_v1'
    };

    var DEFAULTS = {
      apiKey: '',
      model: 'deepseek/deepseek-r1:free',
      theme: 'light',
      systemPrompt: ''
    };

    var settings = Object.assign({}, DEFAULTS, LS.get(STORE.settings, {}));
    if (typeof settings.apiKey !== 'string') settings.apiKey = '';
    if (typeof settings.model !== 'string' || !settings.model.trim()) settings.model = DEFAULTS.model;
    if (typeof settings.systemPrompt !== 'string') settings.systemPrompt = '';
    if (settings.theme !== 'dark') settings.theme = 'light';

    var chats = LS.get(STORE.chats, []);
    if (!Array.isArray(chats)) chats = [];

    // Defensive sanitising of stored chats
    chats = chats.filter(function (c) { return c && typeof c === 'object'; }).map(function (c) {
      return {
        id: typeof c.id === 'string' && c.id ? c.id : uid(),
        title: typeof c.title === 'string' && c.title ? c.title : 'New chat',
        messages: Array.isArray(c.messages)
          ? c.messages.filter(function (m) {
              return m && typeof m === 'object' &&
                (m.role === 'user' || m.role === 'assistant') &&
                typeof m.content === 'string';
            }).map(function (m) { return { role: m.role, content: m.content }; })
          : [],
        systemPrompt: typeof c.systemPrompt === 'string' ? c.systemPrompt : '',
        createdAt: typeof c.createdAt === 'number' ? c.createdAt : Date.now(),
        updatedAt: typeof c.updatedAt === 'number' ? c.updatedAt : Date.now()
      };
    });

    var activeId = LS.get(STORE.active, null);
    if (typeof activeId !== 'string') activeId = null;

    var state = {
      streaming: false,
      abortCtrl: null
    };

    var autoScroll = true;

    /* =========================================================
       3. MARKDOWN
       ========================================================= */
    try {
      if (window.marked && typeof window.marked.setOptions === 'function') {
        window.marked.setOptions({ gfm: true, breaks: true });
      }
    } catch (e) { /* ignore */ }

    function mdToHtml(text) {
      var src = String(text === null || text === undefined ? '' : text);
      try {
        if (window.marked && typeof window.marked.parse === 'function') {
          var out = window.marked.parse(src);
          if (typeof out === 'string') return out;
        }
      } catch (e) { /* fall through to plain text */ }
      return esc(src).replace(/\n/g, '<br>');
    }

    function enhanceCodeBlocks(root) {
      if (!root || !root.querySelectorAll) return;
      try {
        var pres = root.querySelectorAll('pre');
        for (var i = 0; i < pres.length; i++) {
          (function (pre) {
            if (pre.getAttribute('data-enhanced') === '1') return;
            pre.setAttribute('data-enhanced', '1');
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.addEventListener('click', function () {
              var codeEl = pre.querySelector('code');
              var txt = codeEl ? codeEl.innerText : pre.innerText;
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(txt).then(function () {
                    btn.textContent = 'Copied!';
                    setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
                  }).catch(function () {});
                }
              } catch (e) { /* ignore */ }
            });
            pre.appendChild(btn);
          })(pres[i]);
        }
      } catch (e) { /* ignore */ }
    }

    /* =========================================================
       4. CHAT STORAGE HELPERS
       ========================================================= */
    function getChat(id) {
      if (!id) return null;
      for (var i = 0; i < chats.length; i++) {
        if (chats[i] && chats[i].id === id) return chats[i];
      }
      return null;
    }

    function saveChats() {
      if (chats.length > 200) chats = chats.slice(0, 200);
      LS.set(STORE.chats, chats);
      LS.set(STORE.active, activeId);
    }

    function saveSettings() {
      LS.set(STORE.settings, settings);
    }

    /* =========================================================
       5. TYPEWRITER ENGINE (smooth letter-by-letter reveal)
       ========================================================= */
    var tw = {
      el: null,
      queue: '',
      displayed: '',
      lastRender: 0,
      timer: null,
      running: false,
      finished: false,
      onDone: null
    };

    function twRender() {
      if (!tw.el) return;
      if (!tw.displayed && !tw.finished) return;
      tw.el.innerHTML = mdToHtml(tw.displayed);
      scrollToBottom(false);
    }

    function twTick() {
      if (!tw.running) return;

      if (tw.queue.length) {
        var n = Math.min(tw.queue.length, Math.max(1, Math.ceil(tw.queue.length / 24)), 40);
        tw.displayed += tw.queue.slice(0, n);
        tw.queue = tw.queue.slice(n);

        var now = Date.now();
        if (now - tw.lastRender >= 55) {
          tw.lastRender = now;
          twRender();
        }
      } else if (tw.finished) {
        twRender();
        tw.running = false;
        if (tw.timer) { clearInterval(tw.timer); tw.timer = null; }
        var cb = tw.onDone;
        tw.onDone = null;
        if (typeof cb === 'function') cb();
      }
    }

    function startTypewriter(el) {
      tw.el = el;
      tw.queue = '';
      tw.displayed = '';
      tw.lastRender = 0;
      tw.finished = false;
      tw.running = true;
      tw.onDone = null;
      if (tw.timer) { clearInterval(tw.timer); tw.timer = null; }
      tw.timer = setInterval(twTick, 16);
    }

    function finishTypewriter() {
      tw.finished = true;
    }

    function waitTypewriter() {
      return new Promise(function (resolve) {
        if (!tw.running) { resolve(); return; }
        tw.onDone = resolve;
      });
    }

    /* =========================================================
       6. SCROLL MANAGEMENT
       ========================================================= */
    function isNearBottom() {
      var box = $('messages');
      if (!box) return true;
      return (box.scrollHeight - box.scrollTop - box.clientHeight) < 130;
    }

    function scrollToBottom(force) {
      var box = $('messages');
      if (!box) return;
      if (force || autoScroll) box.scrollTop = box.scrollHeight;
    }

    /* =========================================================
       7. TOAST
       ========================================================= */
    var toastTimer = null;
    function toast(msg) {
      var t = $('toast');
      if (!t) return;
      t.textContent = String(msg || '');
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    /* =========================================================
       8. THEME
       ========================================================= */
    function applyTheme() {
      var isDark = settings.theme === 'dark';
      try {
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) { /* ignore */ }
      var icon = $('themeIcon');
      var label = $('themeLabel');
      if (icon) icon.textContent = isDark ? '☀️' : '🌙';
      if (label) label.textContent = isDark ? 'Light mode' : 'Dark mode';
    }

    function toggleTheme() {
      settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
      saveSettings();
      applyTheme();
    }

    /* =========================================================
       9. SIDEBAR (mobile)
       ========================================================= */
    function openSidebar() {
      var sb = $('sidebar'), bd = $('backdrop');
      if (sb) sb.classList.add('open');
      if (bd) bd.classList.add('show');
    }

    function closeSidebar() {
      var sb = $('sidebar'), bd = $('backdrop');
      if (sb) sb.classList.remove('open');
      if (bd) bd.classList.remove('show');
    }

    /* =========================================================
       10. RENDERING — chat list
       ========================================================= */
    function renderChatList() {
      var list = $('chatList');
      if (!list) return;
      list.innerHTML = '';

      var sorted = chats.slice().sort(function (a, b) {
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });

      if (!sorted.length) {
        var empty = document.createElement('div');
        empty.className = 'px-3 py-2 text-xs text-gray-400 dark:text-gray-500';
        empty.textContent = 'No chats yet';
        list.appendChild(empty);
        return;
      }

      sorted.forEach(function (chat) {
        var row = document.createElement('div');
        row.className = 'chat-row' + (chat.id === activeId ? ' active' : '');

        var title = document.createElement('div');
        title.className = 'flex-1 truncate min-w-0';
        title.textContent = chat.title || 'New chat';
        row.appendChild(title);

        var ren = document.createElement('button');
        ren.type = 'button';
        ren.className = 'chat-act';
        ren.title = 'Rename chat';
        ren.setAttribute('aria-label', 'Rename chat');
        ren.textContent = '✏️';
        ren.addEventListener('click', function (e) {
          e.stopPropagation();
          renameChat(chat.id);
        });
        row.appendChild(ren);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'chat-act';
        del.title = 'Delete chat';
        del.setAttribute('aria-label', 'Delete chat');
        del.textContent = '🗑️';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          deleteChat(chat.id);
        });
        row.appendChild(del);

        row.addEventListener('click', function () { selectChat(chat.id); });
        list.appendChild(row);
      });
    }

    /* =========================================================
       11. RENDERING — messages
       ========================================================= */
    function createMessageNode(role) {
      var wrap = document.createElement('div');

      if (role === 'user') {
        wrap.className = 'flex justify-end mb-4';
        var bubble = document.createElement('div');
        bubble.className =
          'max-w-[85%] md:max-w-[75%] rounded-2xl px-4 py-2.5 bg-[#e9eef6] dark:bg-[#2a2b2d] ' +
          'whitespace-pre-wrap break-words text-[15px] leading-relaxed';
        wrap.appendChild(bubble);
        return { wrap: wrap, contentEl: bubble };
      }

      wrap.className = 'flex gap-3 mb-6';
      var avatar = document.createElement('div');
      avatar.className =
        'shrink-0 w-7 h-7 rounded-full grid place-items-center text-white text-[13px] font-bold mt-0.5 ' +
        'bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 select-none';
      avatar.textContent = '✦';

      var body = document.createElement('div');
      body.className = 'md min-w-0 flex-1 break-words pt-0.5';

      wrap.appendChild(avatar);
      wrap.appendChild(body);
      return { wrap: wrap, contentEl: body };
    }

    function renderEmptyState() {
      var inner = $('messagesInner');
      if (!inner) return;

      var wrap = document.createElement('div');
      wrap.className = 'empty-state max-w-2xl mx-auto text-center pt-8 md:pt-20';

      var h = document.createElement('div');
      h.className =
        'text-3xl md:text-5xl font-semibold mb-3 bg-gradient-to-r from-blue-500 via-purple-500 ' +
        'to-pink-500 bg-clip-text text-transparent';
      h.textContent = 'Hello there';
      wrap.appendChild(h);

      var sub = document.createElement('div');
      sub.className = 'text-sm md:text-base text-gray-500 dark:text-gray-400 mb-8';
      sub.textContent = 'Ask me anything. Your chats are stored only on this device.';
      wrap.appendChild(sub);

      var suggestions = [
        'Explain quantum computing in simple terms',
        'Write a JavaScript debounce function',
        'Give me 5 ideas for a weekend project',
        'Summarize the benefits of exercise'
      ];

      var grid = document.createElement('div');
      grid.className = 'grid sm:grid-cols-2 gap-2.5';

      suggestions.forEach(function (text) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sugg-btn';
        btn.textContent = text;
        btn.addEventListener('click', function () {
          var input = $('input');
          if (!input) return;
          input.value = text;
          autoResize();
          handleSend();
        });
        grid.appendChild(btn);
      });

      wrap.appendChild(grid);
      inner.appendChild(wrap);
    }

    function renderMessages() {
      var inner = $('messagesInner');
      if (!inner) return;
      inner.innerHTML = '';

      var chat = getChat(activeId);
      if (!chat || !chat.messages.length) {
        renderEmptyState();
        return;
      }

      chat.messages.forEach(function (m) {
        var node = createMessageNode(m.role);
        if (m.role === 'user') {
          node.contentEl.textContent = m.content;
        } else {
          node.contentEl.innerHTML = mdToHtml(m.content);
          enhanceCodeBlocks(node.contentEl);
        }
        inner.appendChild(node.wrap);
      });

      autoScroll = true;
      scrollToBottom(true);
    }

    function updateHeader() {
      var chat = getChat(activeId);
      var titleEl = $('chatTitle');
      var badge = $('modelBadge');
      if (titleEl) titleEl.textContent = (chat && chat.title) ? chat.title : 'New chat';
      if (badge) badge.textContent = settings.model || DEFAULTS.model;
    }

    /* =========================================================
       12. CHAT ACTIONS
       ========================================================= */
    function createChat(activate) {
      var chat = {
        id: uid(),
        title: 'New chat',
        messages: [],
        systemPrompt: '',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      chats.unshift(chat);
      if (activate !== false) {
        activeId = chat.id;
        saveChats();
        renderChatList();
        renderMessages();
        updateHeader();
        closeSidebar();
        focusInput();
      } else {
        saveChats();
      }
      return chat;
    }

    function selectChat(id) {
      if (state.streaming) {
        toast('Please wait for the current response to finish.');
        return;
      }
      if (!getChat(id)) return;
      activeId = id;
      saveChats();
      autoScroll = true;
      renderChatList();
      renderMessages();
      updateHeader();
      closeSidebar();
    }

    function renameChat(id) {
      var chat = getChat(id);
      if (!chat) return;
      var current = chat.title || 'New chat';
      var next = null;
      try {
        next = window.prompt('Rename chat:', current);
      } catch (e) { next = null; }
      if (next === null) return;
      next = String(next).replace(/\s+/g, ' ').trim();
      if (!next) return;
      chat.title = next.slice(0, 80);
      chat.updatedAt = Date.now();
      saveChats();
      renderChatList();
      updateHeader();
    }

    function deleteChat(id) {
      var chat = getChat(id);
      if (!chat) return;
      var ok = true;
      try {
        ok = window.confirm('Delete "' + (chat.title || 'New chat') + '"? This cannot be undone.');
      } catch (e) { ok = true; }
      if (!ok) return;

      chats = chats.filter(function (c) { return c.id !== id; });

      if (activeId === id) {
        if (chats.length) {
          activeId = chats[0].id;
        } else {
          var fresh = {
            id: uid(), title: 'New chat', messages: [], systemPrompt: '',
            createdAt: Date.now(), updatedAt: Date.now()
          };
          chats.push(fresh);
          activeId = fresh.id;
        }
      }

      saveChats();
      renderChatList();
      renderMessages();
      updateHeader();
    }

    /* =========================================================
       13. COMPOSER
       ========================================================= */
    function autoResize() {
      var ta = $('input');
      if (!ta) return;
      ta.style.height = 'auto';
      var h = Math.min(ta.scrollHeight || 24, 180);
      ta.style.height = h + 'px';
    }

    function focusInput() {
      var ta = $('input');
      if (!ta) return;
      // Avoid forcing the mobile keyboard open on load
      if (window.matchMedia && window.matchMedia('(min-width: 768px)').matches) {
        try { ta.focus(); } catch (e) {}
      }
    }

    function setBusy(busy) {
      var send = $('sendBtn');
      var stop = $('stopBtn');
      var ta = $('input');
      if (send) send.style.display = busy ? 'none' : 'grid';
      if (stop) stop.style.display = busy ? 'grid' : 'none';
      if (ta) ta.setAttribute('aria-busy', busy ? 'true' : 'false');
    }

    /* =========================================================
       14. OPENROUTER STREAMING
       ========================================================= */
    function streamChat(messages, onDelta, signal) {
      var url = 'https://openrouter.ai/api/v1/chat/completions';
      var headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + settings.apiKey.trim(),
        'X-Title': 'Universal AI Chat'
      };
      try {
        if (location && location.origin && location.origin.indexOf('http') === 0) {
          headers['HTTP-Referer'] = location.origin;
        }
      } catch (e) { /* ignore */ }

      return fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          model: (settings.model || DEFAULTS.model).trim(),
          messages: messages,
          stream: true
        }),
        signal: signal
      }).then(function (res) {
        if (!res.ok) {
          return res.text().then(function (txt) {
            var detail = txt || res.statusText || 'Request failed';
            try {
              var parsed = JSON.parse(txt);
              if (parsed && parsed.error && parsed.error.message) detail = parsed.error.message;
            } catch (e) { /* plain text */ }
            throw new Error('HTTP ' + res.status + ' — ' + String(detail).slice(0, 400));
          }).catch(function (err) {
            if (err instanceof Error && err.message.indexOf('HTTP ') === 0) throw err;
            throw new Error('HTTP ' + res.status + ' — ' + (res.statusText || 'Request failed'));
          });
        }

        // Fallback for browsers without streaming body support
        if (!res.body || typeof res.body.getReader !== 'function') {
          return res.json().then(function (data) {
            var c = '';
            try {
              c = data.choices[0].message.content || '';
            } catch (e) { c = ''; }
            if (c) onDelta(c);
          });
        }

        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function pump() {
          return reader.read().then(function (result) {
            if (result.done) return;

            buffer += decoder.decode(result.value, { stream: true });
            var parts = buffer.split('\n');
            buffer = parts.pop() || '';

            for (var i = 0; i < parts.length; i++) {
              var line = parts[i].trim();
              if (!line || line.charAt(0) === ':') continue;
              if (line.indexOf('data:') !== 0) continue;

              var payload = line.slice(5).trim();
              if (payload === '[DONE]') return;

              var json = null;
              try { json = JSON.parse(payload); } catch (e) { continue; }

              if (json && json.error) {
                throw new Error(json.error.message || 'API error');
              }

              var delta = '';
              try {
                if (json.choices && json.choices[0]) {
                  if (json.choices[0].delta && typeof json.choices[0].delta.content === 'string') {
                    delta = json.choices[0].delta.content;
                  } else if (typeof json.choices[0].text === 'string') {
                    delta = json.choices[0].text;
                  }
                }
              } catch (e) { delta = ''; }

              if (delta) onDelta(delta);
            }

            return pump();
          });
        }

        return pump();
      });
    }

    /* =========================================================
       15. SEND FLOW
       ========================================================= */
    function handleSend() {
      if (state.streaming) return;

      var ta = $('input');
      if (!ta) return;
      var text = (ta.value || '').trim();
      if (!text) return;

      if (!settings.apiKey || !settings.apiKey.trim()) {
        openSettings();
        toast('Add your OpenRouter API key first.');
        return;
      }

      var chat = getChat(activeId);
      if (!chat) chat = createChat(true);
      if (!chat) return;

      // ---- persist user message ----
      chat.messages.push({ role: 'user', content: text });
      var userCount = 0;
      for (var i = 0; i < chat.messages.length; i++) {
        if (chat.messages[i].role === 'user') userCount++;
      }
      if (userCount === 1) {
        chat.title = text.slice(0, 60).replace(/\s+/g, ' ').trim() || 'New chat';
      }
      chat.updatedAt = Date.now();
      saveChats();
      renderChatList();
      updateHeader();

      ta.value = '';
      autoResize();

      // ---- DOM: append user + assistant nodes ----
      var inner = $('messagesInner');
      if (!inner) return;
      var es = inner.querySelector('.empty-state');
      if (es) es.remove();

      var uNode = createMessageNode('user');
      uNode.contentEl.textContent = text;
      inner.appendChild(uNode.wrap);

      var aNode = createMessageNode('assistant');
      aNode.contentEl.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      inner.appendChild(aNode.wrap);

      autoScroll = true;
      scrollToBottom(true);

      // ---- build payload ----
      var sys = '';
      if (chat.systemPrompt && chat.systemPrompt.trim()) sys = chat.systemPrompt.trim();
      else if (settings.systemPrompt && settings.systemPrompt.trim()) sys = settings.systemPrompt.trim();

      var payload = [];
      if (sys) payload.push({ role: 'system', content: sys });
      for (var j = 0; j < chat.messages.length; j++) {
        payload.push({ role: chat.messages[j].role, content: chat.messages[j].content });
      }

      // ---- go ----
      state.streaming = true;
      setBusy(true);
      startTypewriter(aNode.contentEl);

      var full = '';
      var errored = null;

      try {
        state.abortCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      } catch (e) {
        state.abortCtrl = null;
      }

      streamChat(
        payload,
        function (delta) {
          full += delta;
          tw.queue += delta;
        },
        state.abortCtrl ? state.abortCtrl.signal : undefined
      ).catch(function (err) {
        if (err && (err.name === 'AbortError' || err.code === 20)) return; // user stopped
        errored = err;
      }).then(function () {
        finishTypewriter();
        return waitTypewriter();
      }).then(function () {
        enhanceCodeBlocks(aNode.contentEl);

        if (errored) {
          var msg = (errored && errored.message) ? errored.message : 'Request failed.';
          var errHtml = '<div class="err-box">⚠️ ' + esc(msg) + '</div>';
          aNode.contentEl.innerHTML = (full ? mdToHtml(full) : '') + errHtml;
          enhanceCodeBlocks(aNode.contentEl);
        } else if (!full) {
          aNode.contentEl.innerHTML = '<div class="err-box">⚠️ The model returned an empty response.</div>';
        }

        if (full) {
          chat.messages.push({ role: 'assistant', content: full });
          chat.updatedAt = Date.now();
          saveChats();
          renderChatList();
        }

        state.streaming = false;
        state.abortCtrl = null;
        setBusy(false);
        scrollToBottom(false);
      });
    }

    function handleStop() {
      if (!state.streaming) return;
      try {
        if (state.abortCtrl && typeof state.abortCtrl.abort === 'function') {
          state.abortCtrl.abort();
        }
      } catch (e) { /* ignore */ }
      toast('Generation stopped.');
    }

    /* =========================================================
       16. SETTINGS MODAL
       ========================================================= */
    function openSettings() {
      var modal = $('settingsModal');
      if (!modal) return;

      var apiEl = $('apiKeyInput');
      var modelEl = $('modelInput');
      var sysEl = $('sysPromptInput');
      var chatSysEl = $('chatSysPromptInput');

      if (apiEl) apiEl.value = settings.apiKey || '';
      if (modelEl) modelEl.value = settings.model || DEFAULTS.model;
      if (sysEl) sysEl.value = settings.systemPrompt || '';

      var chat = getChat(activeId);
      if (chatSysEl) chatSysEl.value = (chat && chat.systemPrompt) ? chat.systemPrompt : '';

      var toggleBtn = $('toggleKeyBtn');
      if (toggleBtn && apiEl) {
        apiEl.type = 'password';
        toggleBtn.textContent = 'Show';
      }

      modal.style.display = 'flex';
    }

    function closeSettings() {
      var modal = $('settingsModal');
      if (modal) modal.style.display = 'none';
    }

    function saveSettingsFromModal() {
      var apiEl = $('apiKeyInput');
      var modelEl = $('modelInput');
      var sysEl = $('sysPromptInput');
      var chatSysEl = $('chatSysPromptInput');

      settings.apiKey = apiEl ? String(apiEl.value || '').trim() : '';
      settings.model = (modelEl && modelEl.value.trim()) ? modelEl.value.trim() : DEFAULTS.model;
      settings.systemPrompt = sysEl ? String(sysEl.value || '') : '';
      saveSettings();

      var chat = getChat(activeId);
      if (chat && chatSysEl) {
        chat.systemPrompt = String(chatSysEl.value || '');
        chat.updatedAt = Date.now();
        saveChats();
      }

      updateHeader();
      closeSettings();
      toast('Settings saved.');
    }

    /* =========================================================
       17. EVENT BINDING
       ========================================================= */
    function bind() {
      // Sidebar
      var menuBtn = $('menuBtn');
      if (menuBtn) menuBtn.addEventListener('click', openSidebar);

      var closeSb = $('closeSidebarBtn');
      if (closeSb) closeSb.addEventListener('click', closeSidebar);

      var backdrop = $('backdrop');
      if (backdrop) backdrop.addEventListener('click', closeSidebar);

      var newChatBtn = $('newChatBtn');
      if (newChatBtn) {
        newChatBtn.addEventListener('click', function () {
          if (state.streaming) { toast('Please wait for the response to finish.'); return; }
          createChat(true);
        });
      }

      var settingsBtn = $('settingsBtn');
      if (settingsBtn) settingsBtn.addEventListener('click', function () {
        closeSidebar();
        openSettings();
      });

      var themeBtn = $('themeBtn');
      if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

      // Composer
      var sendBtn = $('sendBtn');
      if (sendBtn) sendBtn.addEventListener('click', handleSend);

      var stopBtn = $('stopBtn');
      if (stopBtn) stopBtn.addEventListener('click', handleStop);

      var ta = $('input');
      if (ta) {
        ta.addEventListener('input', function () {
          autoResize();
          var v = ta.value.trim();
          var btn = $('sendBtn');
          if (btn) btn.disabled = !v || state.streaming;
        });

        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            handleSend();
          }
        });
      }

      // Messages scroll tracking
      var messages = $('messages');
      if (messages) {
        messages.addEventListener('scroll', function () {
          autoScroll = isNearBottom();
        }, { passive: true });
      }

      // Modal
      var closeS = $('closeSettingsBtn');
      if (closeS) closeS.addEventListener('click', closeSettings);

      var cancelS = $('cancelSettingsBtn');
      if (cancelS) cancelS.addEventListener('click', closeSettings);

      var saveS = $('saveSettingsBtn');
      if (saveS) saveS.addEventListener('click', saveSettingsFromModal);

      var modal = $('settingsModal');
      if (modal) {
        modal.addEventListener('click', function (e) {
          if (e.target === modal) closeSettings();
        });
      }

      var toggleKey = $('toggleKeyBtn');
      if (toggleKey) {
        toggleKey.addEventListener('click', function () {
          var apiEl = $('apiKeyInput');
          if (!apiEl) return;
          if (apiEl.type === 'password') {
            apiEl.type = 'text';
            toggleKey.textContent = 'Hide';
          } else {
            apiEl.type = 'password';
            toggleKey.textContent = 'Show';
          }
        });
      }

      // Escape key
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeSettings();
          closeSidebar();
        }
      });

      // Viewport resize (mobile keyboard / rotation)
      window.addEventListener('resize', function () {
        autoResize();
        scrollToBottom(false);
      });

      // Persist before unload
      window.addEventListener('beforeunload', function () {
        try { saveChats(); } catch (e) {}
      });
    }

    /* =========================================================
       18. INIT
       ========================================================= */
    function init() {
      applyTheme();

      if (!chats.length) {
        var fresh = {
          id: uid(),
          title: 'New chat',
          messages: [],
          systemPrompt: '',
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        chats.push(fresh);
        activeId = fresh.id;
      }

      if (!getChat(activeId)) activeId = chats[0].id;

      saveChats();
      bind();

      renderChatList();
      renderMessages();
      updateHeader();
      autoResize();

      var app = $('app');
      var loading = $('loading');

      if (app) app.style.display = 'flex';
      if (loading) loading.style.display = 'none';

      // Defer focus so mobile browsers do not auto-open the keyboard
      setTimeout(focusInput, 120);
    }

    /* =========================================================
       19. BOOT (with hard safety catch)
       ========================================================= */
    function boot() {
      try {
        init();
      } catch (err) {
        // Never leave the user staring at a blank screen
        var loading = $('loading');
        if (loading) {
          loading.style.display = 'flex';
          loading.textContent = 'App error: ' + ((err && err.message) ? err.message : 'unknown');
        }
        var app = $('app');
        if (app) app.style.display = 'none';
        try { console.error('[Universal AI Chat]', err); } catch (e) {}
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
